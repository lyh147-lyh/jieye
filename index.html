<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人介绍</title>
    <style>
        body {
            margin: 0;
            font-family: "Microsoft YaHei", sans-serif;
            background: #f2f5ff;
            color: #333;
            text-align: center;
        }
        header {
            background: #6378e8;
            color: white;
            padding: 45px 20px;
        }
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: white;
            color: #6378e8;
            font-size: 36px;
            line-height: 100px;
            margin: 0 auto 15px;
        }
        .card {
            background: white;
            margin: 20px auto;
            padding: 22px;
            max-width: 500px;
            width: 82%;
            border-radius: 16px;
            box-shadow: 0 4px 15px #dce1f5;
        }
        button {
            background: #7795e8;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 22px;
            cursor: pointer;
        }
        footer {
            padding: 20px;
            color: #888;
        }
    </style>
</head>
<body>
    <header>
        <div class="avatar">我</div>
        <h1>你好，我是解叶</h1>
        <p>欢迎来到我的个人介绍！</p >
    </header>

    <div class="card">
        <h2>关于我</h2>
        <p>大家好，我是一名热爱六字游戏的跑飞一体机。</p >
        <p>我的爱好是每天上早八之前骂郁丛安，早上下了课打刘艺涵，中午吃了饭打梦梦，晚上在外面抓在外住漂唱的凄彦回来打一顿，睡前再骂一下叙怠。</p >
    </div>

    <div class="card">
        <h2>我的兴趣</h2>
        <p>💻 在四队躺尸</p >
        <p>🎨 寻找零妈妈</p >
        <p>📚 免费逍遥</p >
    </div>

    <div class="card">
        <h2>这是我的ID：般愿</h2>
        <button onclick="alert('快来找我打四队！')">
            点击这里
        </button>
    </div>

    <footer>© 四队欢迎您的加入！</footer>
</body>
</html>
